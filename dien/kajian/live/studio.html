<!DOCTYPE html>
<html lang="id">
<head>
<title>Studio Kajian — JAZMI</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../css/style.css">
<link rel="stylesheet" href="live.css">
</head>
<body>
<header class="lv-bar"><a href="../../../index.html" class="wordmark" aria-label="JAZMI — Beranda"><span class="wordmark-mark" aria-hidden="true">ز</span><span class="wordmark-text"><span class="wordmark-main">JAZMI</span></span></a>
<nav class="lv-crumb"><a href="../index.html">← Kajian</a></nav></header>
<main class="lv-main">
  <h1 class="lv-title">Studio Kajian</h1>
  <p class="lv-status" id="pesan" role="status" aria-live="polite">Memeriksa akun…</p>
  <section class="lv-panel" id="formMulai" hidden>
    <label for="fJudul">Judul kajian</label><input id="fJudul" maxlength="160" placeholder="mis. Kajian Kitab … bab …">
    <label for="fNama">Nama pengajar</label><input id="fNama" maxlength="80">
    <label for="fPdf">Kitab / modul</label><select id="fPdf"><option value="">— tanpa PDF —</option></select>
    <label for="fFb">Tautan Facebook Live (opsional)</label><input id="fFb" inputmode="url" placeholder="https://www.facebook.com/…">
    <button class="btn btn-outline" id="mulai" type="button">Mulai kajian</button>
  </section>
  <section class="lv-panel" id="kendali" hidden>
    <p><strong id="kJudul"></strong></p>
    <div class="lv-tools">
      <button class="btn btn-outline" id="prev" type="button">‹ Sebelumnya</button>
      <input id="goto" type="number" min="1" style="width:5rem" aria-label="Loncat ke halaman">
      <span id="pg">–</span>
      <button class="btn btn-outline" id="next" type="button">Berikutnya ›</button>
    </div>
    <div class="lv-mic" id="audioBox">
      <p><strong>Audio langsung</strong> — <span id="audioSt">belum menyala</span></p>
      <div class="lv-tools">
        <button class="btn btn-outline" id="audioMulai" type="button">🎙 Mulai audio</button>
        <button class="btn btn-outline" id="audioJeda" type="button" hidden>Bisukan</button>
      </div>
      <div class="lv-meter" aria-hidden="true"><i id="meter"></i></div>
      <p class="lv-hint" id="audioPend"></p>
      <p class="lv-hint">Biarkan layar menyala dan halaman ini tetap terbuka selama siaran. Pakai headset bila memungkinkan.</p>
    </div>
    <label for="gantiPdf">Ganti kitab / modul</label><select id="gantiPdf"><option value="">—</option></select>
    <p><a id="tautPenonton" href="index.html" target="_blank" rel="noopener">Buka ruang penonton ↗</a></p>
    <button class="btn btn-outline" id="selesai" type="button">Akhiri kajian</button>
    <div class="lv-canvas"><canvas id="cv"></canvas></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../../js/auth-config.js"></script>
<script src="../../../js/live-config.js"></script>
<script src="../../../js/live-audio.js"></script>
<script src="../../../js/live-pdf.js"></script>
<script src="studio.js"></script>
</body>
</html>
